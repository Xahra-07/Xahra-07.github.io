<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkedIn Banner Design</title>
  
  <!-- Plus Jakarta Sans from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

  <style>
    /* Reset & Base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }

    /* Banner Container - Exact LinkedIn Dimensions */
    .banner {
      width: 1584px;
      height: 396px;
      background-color: #010066; /* Brand Navy */
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 64px;
      z-index: 0;
    }

    /* Top Left Corner Logo */
    .top-left-logo {
      position: absolute;
      top: 36px;
      left: 56px;
      height: 38px;
      width: auto;
      z-index: 20;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
    }

    /* Brand Pattern Background Overlay */
    .pattern-bg {
      position: absolute;
      inset: 0;
      background-image: url('brand-pattern.png');
      background-repeat: repeat;
      background-size: 500px; /* Clean scale for diagonal shapes */
      opacity: 0.16; /* Subtle, non-distracting background */
      mix-blend-mode: multiply; /* Blends white shapes into navy background */
      z-index: 1;
    }

    /* Dark Radial Gradient to focus attention and fade out pattern */
    .pattern-fade {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 80% 50%, rgba(1, 0, 102, 0.4) 0%, rgba(1, 0, 102, 0.95) 80%);
      z-index: 2;
    }

    /* Subtle ambient glows using Gold (#CBA135) */
    .ambient-glow-left {
      position: absolute;
      top: 60%;
      left: 30%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(203, 161, 53, 0.12) 0%, rgba(203, 161, 53, 0) 70%);
      z-index: 3;
      pointer-events: none;
    }

    .ambient-glow-right {
      position: absolute;
      top: 40%;
      right: 15%;
      transform: translate(50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(203, 161, 53, 0.08) 0%, rgba(203, 161, 53, 0) 70%);
      z-index: 3;
      pointer-events: none;
    }

    /* Left Side Content (Name, Systems Engineer Title, Quote) */
    .left-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100%;
      padding-left: 350px; /* Safe space to prevent LinkedIn DP overlap */
      max-width: 820px;
      padding-top: 15px;
    }

    /* Display Font simulation matching the portfolio h1.display-font style */
    .display-font {
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.04em;
      line-height: 0.92;
    }

    .name-title {
      font-size: 66px;
      color: #FFFFFF;
      margin-bottom: 10px;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
    }

    .role-title {
      font-size: 22px;
      color: #CBA135; /* Brand Gold */
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 24px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .role-title::after {
      content: '';
      display: inline-block;
      width: 42px;
      height: 2.5px;
      background: #CBA135;
      border-radius: 2px;
    }

    .quote-box {
      border-left: 3.5px solid #CBA135;
      padding-left: 18px;
      max-width: 530px;
    }

    .quote-text {
      font-size: 17.5px;
      color: rgba(255, 255, 255, 0.95);
      line-height: 1.5;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .quote-text em {
      color: #CBA135;
      font-style: normal;
      font-weight: 700;
    }

    /* Right Side Content (Tech Stack Silos with Iconic Logos + Labels) */
    .right-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-right: 0px;
      padding-top: 10px;
    }

    /* Silo Rectangle Grouping - Widened with generous internal padding */
    .silo-card {
      width: 630px;
      height: 90px;
      background: rgba(1, 0, 102, 0.58); /* Glass Navy */
      border: 1.5px solid rgba(203, 161, 53, 0.35); /* Gold outline */
      border-radius: 20px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .silo-card:hover {
      border-color: rgba(203, 161, 53, 0.7);
      box-shadow: 0 8px 32px rgba(203, 161, 53, 0.15);
    }

    /* Silo Left Column (Category Title) - 2 lines max, ample width */
    .silo-category {
      width: 175px;
      min-width: 175px;
      font-size: 14.5px;
      font-weight: 800;
      color: #CBA135; /* Gold category text */
      text-transform: uppercase;
      letter-spacing: 0.07em;
      border-right: 1.5px solid rgba(255, 255, 255, 0.2);
      padding-right: 18px;
      margin-right: 22px;
      line-height: 1.3;
      white-space: normal;
    }

    /* Silo Right Column (Tools list with SVG icons & text) - spacious layout */
    .silo-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 9px 12px;
      align-items: center;
    }

    /* Premium Pill Badge for Tools */
    .tool-pill {
      background: rgba(255, 255, 255, 0.08);
      border: 1.2px solid rgba(255, 255, 255, 0.16);
      color: #FFFFFF;
      padding: 6px 13px;
      border-radius: 24px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .tool-pill svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
      flex-shrink: 0;
      opacity: 0.92;
    }

    .tool-pill:hover {
      background: rgba(203, 161, 53, 0.18);
      border-color: rgba(203, 161, 53, 0.5);
      color: #CBA135;
    }
  </style>
</head>
<body>

  <div class="banner">
    <!-- Visual background layers -->
    <div class="pattern-bg"></div>
    <div class="pattern-fade"></div>
    <div class="ambient-glow-left"></div>
    <div class="ambient-glow-right"></div>

    <!-- Top Left Brand Logo -->
    <img src="xahra-logo-white.png" alt="Xahra" class="top-left-logo">

    <!-- Left Branding Section -->
    <div class="left-content">
      <div class="name-title display-font">FATIMAH ISMAILA</div>
      <div class="role-title">SYSTEMS ENGINEER</div>
      <div class="quote-box">
        <p class="quote-text">"Form is design. Function is engineering. <em>I do both.</em>"</p>
      </div>
    </div>

    <!-- Right Stack Silo Section -->
    <div class="right-content">
      
      <!-- Silo 1: Systems & Cloud -->
      <div class="silo-card">
        <div class="silo-category">Cloud &amp;<br>Systems</div>
        <div class="silo-tools">
          <span class="tool-pill">
            <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg>
            Google Cloud (ACE)
          </span>
          <span class="tool-pill">
            <svg viewBox="0 0 24 24"><path d="M2 13h20v2H2zm1-5h4v3H3zm6 0h4v3H9zm6 0h4v3h-4zm-8-4h4v3H7zm6 0h4v3h-4zM2 16h20c-1 3.5-4.5 6-10 6S3 19.5 2 16z"/></svg>
            Docker
          </span>
          <span class="tool-pill">
            <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V8h16v10zm-12-3l3-3-3-3 1.4-1.4 4.4 4.4-4.4 4.4L8 15zm6 0h4v2h-4v-2z"/></svg>
            Linux
          </span>
        </div>
      </div>

      <!-- Silo 2: ServiceNow Architecture -->
      <div class="silo-card">
        <div class="silo-category">ServiceNow<br>Architecture</div>
        <div class="silo-tools">
          <span class="tool-pill">
            <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
            CIS-DF
          </span>
          <span class="tool-pill">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 3c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm7 13H5v-.23c0-.62.28-1.2.76-1.58C7.47 15.82 9.64 15 12 15s4.53.82 6.24 2.19c.48.38.76.97.76 1.58v.23z"/></svg>
            CSA &amp; CAD
          </span>
          <span class="tool-pill">
            <svg viewBox="0 0 24 24"><path d="M17 17h2v-4h-2v4zm0-6h2V7h-2v4zm-6 6h2V7h-2v10zm-6 0h2v-7H5v7zM3 3h18a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/></svg>
            Flow Designer
          </span>
          <span class="tool-pill">
            <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
            ITSM &amp; CSDM
          </span>
        </div>
      </div>

      <!-- Silo 3: Systems IA & Product UX -->
      <div class="silo-card">
        <div class="silo-category">Systems IA &amp;<br>Product UX</div>
        <div class="silo-tools">
          <span class="tool-pill">
            <svg viewBox="0 0 24 24"><path d="M11.99 18.54l-7.37-5.73L3 14.07l9 7 9-7-1.63-1.27-7.38 5.74zM12 16l7.36-5.73L21 9.01l-9-7-9 7 1.63 1.27L12 16z"/></svg>
            Information Architecture
          </span>
          <span class="tool-pill">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
            Journey Governance
          </span>
          <span class="tool-pill">
            <svg viewBox="0 0 24 24"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm2.85 11.1l-.85.6V16h-4v-2.3l-.85-.6C7.8 12.16 7 10.63 7 9c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.63-.8 3.16-2.15 4.1z"/></svg>
            Design Thinking
          </span>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
